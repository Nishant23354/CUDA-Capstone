<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">CPU and GPU signal processing time</title>
<desc id="desc">Runtime in milliseconds for workloads of 256 and 1024 signals. GPU compute is faster, while total GPU time including transfers is longer than CPU runtime.</desc>
<rect width="900" height="470" fill="#fff"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#172033">CPU vs GPU runtime</text><text x="450" y="64" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Lower is faster · time in milliseconds</text>
<g stroke="#dbe2ea" stroke-width="1"><path d="M100 380H820M100 320H820M100 260H820M100 200H820M100 140H820M100 80H820"/></g><g fill="#475569" font-family="Arial" font-size="12" text-anchor="end"><text x="90" y="384">0</text><text x="90" y="324">10</text><text x="90" y="264">20</text><text x="90" y="204">30</text><text x="90" y="144">40</text><text x="90" y="84">50</text></g>
<g font-family="Arial" font-size="13" text-anchor="middle"><rect x="255" y="334.27" width="50" height="45.73" fill="#475569"/><rect x="315" y="369.51" width="50" height="10.49" fill="#2563eb"/><rect x="375" y="322.996" width="50" height="57.004" fill="#f59e0b"/><text x="280" y="326">7.62</text><text x="340" y="362">1.75</text><text x="400" y="315">9.50</text><text x="340" y="410" font-size="15" font-weight="bold">256 signals</text>
<rect x="545" y="182.57" width="50" height="197.43" fill="#475569"/><rect x="605" y="339.70" width="50" height="40.30" fill="#2563eb"/><rect x="665" y="153.19" width="50" height="226.81" fill="#f59e0b"/><text x="570" y="174">32.90</text><text x="630" y="332">6.72</text><text x="690" y="145">37.80</text><text x="630" y="410" font-size="15" font-weight="bold">1,024 signals</text></g>
<g font-family="Arial" font-size="13" fill="#334155"><rect x="235" y="433" width="14" height="14" fill="#475569"/><text x="256" y="445">CPU</text><rect x="330" y="433" width="14" height="14" fill="#2563eb"/><text x="351" y="445">GPU compute</text><rect x="480" y="433" width="14" height="14" fill="#f59e0b"/><text x="501" y="445">GPU total (including transfers)</text></g>
</svg>

