<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">CUDA compute and end-to-end speedup</title><desc id="desc">Compute speedup is 4.36 times and 4.90 times for the 256 and 1024 signal workloads. End-to-end speedup is below one because transfers are included.</desc>
<rect width="900" height="440" fill="#fff"/><text x="450" y="40" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#172033">Compute speedup vs end-to-end speedup</text><text x="450" y="65" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Speedup = CPU time ÷ GPU time · values below 1 mean GPU total time was slower</text>
<g stroke="#dbe2ea"><path d="M120 350H800M120 290H800M120 230H800M120 170H800M120 110H800"/></g><g fill="#475569" font-family="Arial" font-size="12" text-anchor="end"><text x="108" y="354">0</text><text x="108" y="294">1</text><text x="108" y="234">2</text><text x="108" y="174">3</text><text x="108" y="114">4</text></g>
<g font-family="Arial" text-anchor="middle"><rect x="270" y="88.55" width="76" height="261.45" fill="#2563eb"/><rect x="354" y="301.87" width="76" height="48.13" fill="#f59e0b"/><text x="308" y="78" font-size="16" fill="#172033">4.36x</text><text x="392" y="293" font-size="16" fill="#172033">0.80x</text><text x="350" y="386" font-size="15" font-weight="bold" fill="#172033">256 signals</text>
<rect x="560" y="56.06" width="76" height="293.94" fill="#2563eb"/><rect x="644" y="297.77" width="76" height="52.23" fill="#f59e0b"/><text x="598" y="47" font-size="16" fill="#172033">4.90x</text><text x="682" y="289" font-size="16" fill="#172033">0.87x</text><text x="640" y="386" font-size="15" font-weight="bold" fill="#172033">1,024 signals</text></g>
<g font-family="Arial" font-size="13" fill="#334155"><rect x="295" y="413" width="14" height="14" fill="#2563eb"/><text x="316" y="425">GPU compute speedup</text><rect x="500" y="413" width="14" height="14" fill="#f59e0b"/><text x="521" y="425">GPU end-to-end speedup</text></g></svg>

